[project]
name = "scholartrust"
version = "0.1.0"
description = "学术专家知识库与可信尽调 Agent（可信采集 + 混合检索 + 多 Agent 调度）"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "langgraph==1.2.18",
    "numpy==1.26.4",
    "transformers==4.45.0",
    "onnxruntime==1.31.1",
]

[project.optional-dependencies]
dev = ["pytest==7.4.0", "coverage[toml]>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/*_data.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
